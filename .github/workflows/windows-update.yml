name: Publish validated Windows update
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated stable tag (vX.Y.Z)
        required: true
        type: string
      candidate_run:
        description: Successful trusted tag build run containing windows-update-candidate
        required: true
        type: string
      previous_version:
        description: Previously published managed version (without v); empty for the first managed release
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: windows-update-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  sign:
    if: github.ref == 'refs/heads/main' && github.repository == 'downdone/daymark' && vars.DAYMARK_MANAGED_WINDOWS_RELEASE == 'true'
    environment: windows-update-release
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      source: ${{ steps.provenance.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Verify immutable candidate provenance
        id: provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: |
          if ($env:UPDATE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or $env:CANDIDATE_RUN -notmatch '^[1-9][0-9]*$') { throw 'Invalid immutable identities' }
          if ($env:PREVIOUS_VERSION -and ($env:PREVIOUS_VERSION -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or
              [version]$env:PREVIOUS_VERSION -ge [version]$env:UPDATE_TAG.Substring(1))) { throw 'Expected an earlier stable version' }
          & git fetch --no-tags origin main:refs/remotes/origin/main
          & git fetch --no-tags --force origin "refs/tags/$env:UPDATE_TAG`:refs/tags/$env:UPDATE_TAG"
          if ($LASTEXITCODE -ne 0 -or (& git cat-file -t "refs/tags/$env:UPDATE_TAG") -ne 'tag') { throw 'Annotated source tag required' }
          $source = (& git rev-parse "refs/tags/$env:UPDATE_TAG^{}").Trim()
          & git merge-base --is-ancestor $source origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Source must be reviewed on main' }
          $run = (& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN") | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.path -ne '.github/workflows/release-build.yml' -or $run.conclusion -ne 'success' -or $run.repository.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Candidate run provenance mismatch' }
          $tagBuild = $run.event -eq 'push' -and $run.head_sha -eq $source -and $run.head_branch -eq $env:UPDATE_TAG
          $manualBuild = $run.event -eq 'workflow_dispatch' -and $run.head_branch -eq 'main'
          if (!$tagBuild -and !$manualBuild) { throw 'Only exact tag pushes or reviewed main immutable rebuilds are accepted' }
          if ($manualBuild) {
            & git merge-base --is-ancestor $run.head_sha origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Rebuild tooling must be reviewed on main' }
            & git merge-base --is-ancestor $source $run.head_sha
            if ($LASTEXITCODE -ne 0) { throw 'Rebuild tooling must descend from the immutable source' }
          }
          [ordered]@{id=$run.id;head_sha=$run.head_sha;head_branch=$run.head_branch;event=$run.event;source=$source;tag=$env:UPDATE_TAG} |
            ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/candidate-run.json" -Encoding utf8
          "source=$source" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
          name: windows-update-candidate
          path: build/candidate
      - name: Sign the five executables with the pinned self-signed certificate
        shell: pwsh
        env:
          CODE_SIGNING_PFX: ${{ secrets.DAYMARK_AUTHENTICODE_PFX_BASE64 }}
          CODE_SIGNING_PASSWORD: ${{ secrets.DAYMARK_AUTHENTICODE_PASSWORD }}
          OFFICIAL_SERVICE_URL: ${{ secrets.DAYMARK_OFFICIAL_SERVICE_URL }}
        run: |
          $run = Get-Content "$env:RUNNER_TEMP/candidate-run.json" -Raw | ConvertFrom-Json
          python scripts/update_release_gates.py --run "$env:RUNNER_TEMP/candidate-run.json" --record build/candidate/payload/BUILD-PROVENANCE.json
          if ($LASTEXITCODE -ne 0) { throw 'Immutable rebuild artifact provenance mismatch' }
          $origin = $env:OFFICIAL_SERVICE_URL.Trim().TrimEnd('/')
          $binaryText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("$PWD/build/candidate/payload/daymark.exe"))
          if (!$origin -or !$binaryText.Contains($origin)) { throw 'Built official account configuration is missing; no release was uploaded' }
          $policy = Get-Content config/authenticode-policy.json -Raw | ConvertFrom-Json
          if ($policy.format -ne 1 -or $policy.policy -ne 'self-signed-pinned' -or $policy.public_trust -ne $false -or $policy.certificate_sha256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Unsupported signing policy' }
          if (!$env:CODE_SIGNING_PFX -or !$env:CODE_SIGNING_PASSWORD) { throw 'Protected signing secrets missing' }
          $pfx = Join-Path $env:RUNNER_TEMP 'daymark-signing.pfx'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:CODE_SIGNING_PFX))
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:CODE_SIGNING_PASSWORD -AsPlainText -Force)
            $pin = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($certificate.RawData)).ToLowerInvariant()
            if ($pin -cne $policy.certificate_sha256) { throw 'Signing certificate does not match reviewed pin' }
            foreach ($store in @('Cert:\CurrentUser\Root','Cert:\CurrentUser\TrustedPublisher','Cert:\LocalMachine\Root')) {
              if (Test-Path -LiteralPath "$store\$($certificate.Thumbprint)") { throw 'Self-signed publisher must not be installed in a system trust store' }
            }
            $tools = @(Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin' -Directory | Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } | Sort-Object { [version]$_.Name } -Descending)
            $tool = @($tools | ForEach-Object { Join-Path $_.FullName 'x64/signtool.exe' } | Where-Object { Test-Path -LiteralPath $_ }) | Select-Object -First 1
            if (!$tool) { throw 'Windows SDK signing tool unavailable' }
            ./scripts/Sign-WindowsCandidate.ps1 -Directory build/candidate -CertificateThumbprint $certificate.Thumbprint -CertificateSha256 $pin -SignTool $tool
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx }
            if ($null -ne $certificate) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-update-signed
          path: build/candidate/
          if-no-files-found: error
  validate:
    needs: sign
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
          architecture: x64
      # Independent runner: no Qt install, no private keys or Environment secrets.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-update-signed
          path: build/candidate
      - name: Validate deployed runtime and bind evidence
        shell: pwsh
        env:
          UPDATE_SOURCE: ${{ needs.sign.outputs.source }}
          UPDATE_TAG: ${{ inputs.tag }}
        run: ./scripts/Test-WindowsUpdateCandidate.ps1 -Directory build/candidate -SourceRevision "$env:UPDATE_SOURCE" -Version ($env:UPDATE_TAG.Substring(1))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-update-validated
          path: build/candidate/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-update-deployment-evidence
          path: build/deployment-evidence/
          if-no-files-found: ignore
  publish:
    needs: [sign, validate]
    environment: windows-update-release
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-update-validated
          path: build/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
          name: windows-installer-test
          path: build/installer-test
      - name: Get pinned installer compiler
        shell: pwsh
        run: |
          $compiler=./scripts/Get-PinnedNsis.ps1 -Directory build/nsis
          "DAYMARK_MAKENSIS=$compiler" >> $env:GITHUB_ENV
      - name: Verify signatures again before signing the manifest
        shell: pwsh
        run: |
          $policy = Get-Content config/authenticode-policy.json -Raw | ConvertFrom-Json
          Import-Module ./scripts/Authenticode.psm1 -Force
          foreach ($file in @('payload/daymark.exe','native/daymark-launcher.exe','native/daymark-update-cli.exe','native/daymark-updater.exe','native/daymark-setup-helper.exe')) {
            $null = Assert-DaymarkSelfSignedExecutable "build/candidate/$file" $policy.certificate_sha256
          }
          "DAYMARK_AUTHENTICODE_CERT_SHA256=$($policy.certificate_sha256)" >> $env:GITHUB_ENV
      - name: Sign and publish ready files last
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.DAYMARK_UPDATE_SIGNING_KEY }}
          CODE_SIGNING_PFX: ${{ secrets.DAYMARK_AUTHENTICODE_PFX_BASE64 }}
          CODE_SIGNING_PASSWORD: ${{ secrets.DAYMARK_AUTHENTICODE_PASSWORD }}
          UPDATE_TAG: ${{ inputs.tag }}
          UPDATE_SOURCE: ${{ needs.sign.outputs.source }}
        run: |
          $pfx=Join-Path $env:RUNNER_TEMP 'installer-signing.pfx'
          $certificate=$null
          try {
            [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:CODE_SIGNING_PFX))
            $certificate=Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:CODE_SIGNING_PASSWORD -AsPlainText -Force)
            $pin=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($certificate.RawData)).ToLowerInvariant()
            if ($pin -cne $env:DAYMARK_AUTHENTICODE_CERT_SHA256) { throw 'Installer certificate pin mismatch' }
            $tools=@(Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin' -Directory | Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } | Sort-Object { [version]$_.Name } -Descending)
            $tool=@($tools | ForEach-Object { Join-Path $_.FullName 'x64/signtool.exe' } | Where-Object { Test-Path -LiteralPath $_ }) | Select-Object -First 1
            if (!$tool) { throw 'Windows SDK signing tool unavailable' }
            python scripts/publish-windows-update.py --directory build/candidate --tag "$env:UPDATE_TAG" --source "$env:UPDATE_SOURCE" --makensis "$env:DAYMARK_MAKENSIS" --signtool "$tool" --certificate-thumbprint "$($certificate.Thumbprint)" --installer-test build/installer-test/test_installer_flow.exe
            if ($LASTEXITCODE -ne 0) { throw 'Package, installer acceptance or publication failed' }
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx }
            if ($null -ne $certificate) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-installer-publication-proof
          path: build/installer-publication-proof/
          if-no-files-found: ignore
  verify-installer:
    needs: publish
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify-windows-installer.yml
    with:
      tag: ${{ inputs.tag }}
      candidate_run: ${{ inputs.candidate_run }}
  verify-update:
    needs: publish
    if: inputs.previous_version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/verify-windows-update.yml
    with:
      old_version: ${{ inputs.previous_version }}
      new_version: ${{ inputs.tag }}
