name: Publish source release
on:
  push:
    tags: ['v*']
concurrency:
  group: source-releases
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test release guards
        run: python3 -m unittest discover -s tests -p test_release_metadata.py -v
      - name: Check source release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish-source-release.py --tag "$RELEASE_TAG" --check
      - name: Fetch publication branch explicitly
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Publish source-only GitHub Release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-source-release.py --tag "$RELEASE_TAG"
