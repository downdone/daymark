name: Publish tagged build

# Tag pushes currently build Windows only and attach its archive to the
# source-only GitHub Release created by release-source.yml. Tagged source is
# already gated there (annotated tag, version, notes, main reachability), so
# this workflow only adds build artifacts and never edits release metadata.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild an existing immutable stable tag using reviewed main tooling
        required: true
        type: string
      runtime_audit_only:
        description: Audit the runner CRT inventory without compiling the application
        required: false
        default: false
        type: boolean
  push:
    tags: ['v*']
    branches: ['main']
    paths: ['.github/build-request.json']
permissions:
  contents: read
concurrency:
  group: release-build-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      matrix: ${{ steps.source.outputs.matrix }}
      reuse_run: ${{ steps.source.outputs.reuse_run }}
      runtime_audit_only: ${{ steps.source.outputs.runtime_audit_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve immutable source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          expected = None
          audit_only = False
          request = {}
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              if os.environ["GITHUB_REF"] != "refs/heads/main":
                  raise ValueError("Manual immutable rebuild requires main tooling")
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              tag = event["inputs"]["tag"]
              audit_only = event["inputs"].get("runtime_audit_only", False) in (True, "true")
          elif os.environ["GITHUB_REF"].startswith("refs/tags/"):
              tag = os.environ["GITHUB_REF_NAME"]
              expected = git("rev-parse", "HEAD")
          else:
              if os.environ["GITHUB_REF"] != "refs/heads/main":
                  raise ValueError("Recovery requires main")
              request = json.loads(Path(".github/build-request.json").read_text())
              tag, expected = request["tag"], request["commit"]
              if not re.fullmatch(r"[0-9a-f]{40}", expected):
                  raise ValueError("Recovery requires an exact source commit")
          if not re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", tag):
              raise ValueError("Stable release tag required")
          git("fetch", "--no-tags", "origin", "main:refs/remotes/origin/main")
          # Restore only the disposable runner ref; never write a remote tag.
          git("fetch", "--no-tags", "--force", "origin", f"refs/tags/{tag}:refs/tags/{tag}")
          if git("cat-file", "-t", f"refs/tags/{tag}") != "tag":
              raise ValueError("Annotated tag required")
          commit = git("rev-parse", f"refs/tags/{tag}^{{}}")
          if expected and commit != expected:
              raise ValueError("Recovery tag differs from pinned source")
          subprocess.run(["git", "merge-base", "--is-ancestor", commit, "origin/main"], check=True)
          platforms = [
              {"os":"windows-2022","label":"windows-x64","arch":"win64_msvc2022_64"}]
          # Retain the already verified historical recovery path below. New
          # releases neither build nor require Linux/macOS archives.
          reuse_run = request.get("reuse_assets_run", "")
          if reuse_run:
              tooling = request.get("reuse_assets_commit", "")
              if type(reuse_run) is not int or reuse_run < 1 or not re.fullmatch(r"[0-9a-f]{40}", tooling):
                  raise ValueError("Asset reuse requires exact run and tooling identities")
              old_request = json.loads(git("show", tooling+":.github/build-request.json"))
              if old_request.get("tag") != tag or old_request.get("commit") != commit:
                  raise ValueError("Previous build request identifies another source")
              repo = os.environ["GITHUB_REPOSITORY"]
              def api(path):
                  req = urllib.request.Request("https://api.github.com/repos/"+repo+path,
                      headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"User-Agent":"Daymark-release-recovery","Accept":"application/vnd.github+json"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              run = api(f"/actions/runs/{reuse_run}")
              if (run["head_sha"] != tooling or run["status"] != "completed"
                      or run["event"] != "push" or run["path"] != ".github/workflows/release-build.yml"
                      or run["repository"]["full_name"] != repo):
                  raise ValueError("Previous run provenance mismatch")
              jobs = api(f"/actions/runs/{reuse_run}/jobs?per_page=100")["jobs"]
              required = {"resolve", "linux-x64", "macos-arm64"}
              if not required.issubset({j["name"] for j in jobs if j["conclusion"] == "success"}):
                  raise ValueError("Previous Linux/macOS gates did not pass")
              artifacts = api(f"/actions/runs/{reuse_run}/artifacts?per_page=100")["artifacts"]
              names = {a["name"] for a in artifacts if not a["expired"] and a["name"].startswith("release-")}
              if names != {"release-linux-x64", "release-macos-arm64"}:
                  raise ValueError("Expected complete Linux/macOS archives only")
              platforms = platforms[:1]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\ncommit={commit}\nreuse_run={reuse_run}\n")
              output.write("runtime_audit_only="+str(audit_only).lower()+"\n")
              output.write("matrix="+json.dumps({"include":platforms},separators=(",",":"))+"\n")
          print(f"Verified immutable source: {tag} {commit}")
          PY
  runtime-audit:
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Inspect and verify the actual licensed CRT before compiling
        shell: pwsh
        run: |
          Import-Module ./scripts/MsvcRuntime.psm1 -Force
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$installation) { throw 'VS2022 installation missing' }
          $source = Get-DaymarkMsvcRedistDirectory (Join-Path $installation 'VC/Redist/MSVC')
          Get-ChildItem -LiteralPath $source -Force | Select-Object Name,@{Name='Version';Expression={$_.VersionInfo.FileVersion}} | Format-Table
          $target = Join-Path $env:RUNNER_TEMP 'daymark-crt-audit'
          New-Item -ItemType Directory -Path $target | Out-Null
          $evidence = @(Copy-DaymarkMsvcRuntime $target)
          $evidence | ConvertTo-Json -Depth 4
  build:
    needs: [resolve, runtime-audit]
    if: needs.resolve.outputs.runtime_audit_only != 'true'
    environment: windows-update-release
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      # The release guard is the same one the source workflow runs, so a build
      # can never be produced for a tag whose metadata is inconsistent.
      - name: Verify tag metadata
        shell: bash
        run: python3 scripts/publish-source-release.py --tag "$RELEASE_TAG" --check
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libgl1-mesa-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libxcb-xkb1 libdbus-1-3 \
            fonts-noto-cjk fonts-dejavu-core
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
          architecture: x64
      # Open-source Qt (LGPLv3) only; see ADR-027.
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.10.2'
          modules: 'qtshadertools'
          arch: ${{ matrix.arch }}
          cache: true
          aqtversion: '==3.3.0'
          install-deps: false
      - name: Configure
        shell: pwsh
        env:
          UPDATE_PUBLIC_KEYS: ${{ vars.DAYMARK_UPDATE_PUBLIC_KEYS_JSON }}
          OFFICIAL_SERVICE_URL: ${{ secrets.DAYMARK_OFFICIAL_SERVICE_URL }}
          MANAGED_RELEASE: ${{ vars.DAYMARK_MANAGED_WINDOWS_RELEASE }}
        run: |
          $options = @('-S','.','-B','build/release','-DCMAKE_BUILD_TYPE=Release','-DBUILD_TESTING=ON')
          if ($env:UPDATE_PUBLIC_KEYS -and (Test-Path src/update/CMakeLists.txt)) {
            New-Item -ItemType Directory build -Force | Out-Null
            [IO.File]::WriteAllText("$PWD/build/update-public-keys.json",$env:UPDATE_PUBLIC_KEYS,[Text.UTF8Encoding]::new($false))
            $options += "-DDAYMARK_UPDATE_PUBLIC_KEYS=$PWD/build/update-public-keys.json"
          }
          $official = "$PWD/build/official-service.local.txt"
          if ($env:MANAGED_RELEASE -eq 'true' -and !$env:OFFICIAL_SERVICE_URL) { throw 'Protected official service configuration is required for managed releases' }
          if ($env:OFFICIAL_SERVICE_URL) {
            New-Item -ItemType Directory build -Force | Out-Null
            [IO.File]::WriteAllText($official,$env:OFFICIAL_SERVICE_URL.Trim(),[Text.UTF8Encoding]::new($false))
            $options += "-DDAYMARK_OFFICIAL_CONFIG=$official"
          }
          & cmake @options
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
      - name: Build
        shell: pwsh
        run: |
          cmake --build build/release --config Release --target daymark-update-cli daymark-bootstrap daymark-updater --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/release --config Release --parallel 4
      - name: Test
        shell: bash
        run: |
          set +e
          report="$PWD/build/ctest-report.xml"
          log="$PWD/build/ctest-console.log"
          ctest --test-dir build/release -C Release --output-on-failure --no-tests=error \
                --output-junit "$report" >"$log" 2>&1
          status=$?
          cat "$log"
          python3 scripts/report-ctest-failures.py "$report" "$log" || true
          exit $status
      - name: QML lint
        run: cmake --build build/release --config Release --target daymark_qmllint daymark_style_qmllint
      # Windows: windeployqt against the MSVC kit produces the portable ZIP.
      # The stricter local-preview audit (scripts/package-windows.ps1) targets the
      # MinGW preset and is not usable here.
      # Recovery uses the current packager, while inputs and built executable
      # remain the immutable source verified by resolve.
      - name: Checkout release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: build/release-tools
          persist-credentials: false
      - name: Test release tooling
        shell: bash
        run: python3 -m unittest discover -s build/release-tools/tests -p test_qt_sbom.py -v
      - name: Test Windows release layout
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/release-tools/tests/scripts/TaggedPackagingTest.ps1
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DAYMARK_QT: ${{ env.QT_ROOT_DIR }}
        run: |
          try {
            $version = (Select-String -Path CMakeLists.txt -Pattern 'set\(DAYMARK_VERSION "([^"]+)"\)').Matches[0].Groups[1].Value
            & ./build/release-tools/scripts/package-tagged-windows.ps1 -SourceDirectory $PWD -BuildDirectory build/release -OutputDirectory build/artifacts -Version $version
          } catch {
            $message=$_.Exception.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows packaging failed::$message"
            throw
          }
      # macOS and Linux ship an executable archive only; signing/notarisation
      # and a clean-machine gate are still open (see release-policy).
      # macOS ships a self-contained .app via macdeployqt; Linux gets the binary,
      # the Qt shared libraries it links, the plugins it loads and the QML imports,
      # with a qt.conf and a launcher that points LD_LIBRARY_PATH at ./lib.
      # Neither archive is code-signed or clean-machine validated.
      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error title=Packaging failed::Command failed: ${BASH_COMMAND}"' ERR
          name="Daymark-${RELEASE_TAG#v}-${{ matrix.label }}"
          stage="build/stage/$name"
          mkdir -p "build/artifacts" "$stage"
          QTDIR="${QT_ROOT_DIR:-$Qt6_DIR}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            [ -d build/release/bin/daymark.app ] || { echo "::error::daymark.app missing"; exit 1; }
            cp -R build/release/bin/daymark.app "$stage/"
            "$QTDIR/bin/macdeployqt" "$stage/daymark.app" -qmldir="$PWD/src/ui" -always-overwrite
          else
            [ -x build/release/bin/daymark ] || { echo "::error::daymark binary missing"; exit 1; }
            cp build/release/bin/daymark "$stage/"
            mkdir -p "$stage/lib" "$stage/plugins"
            for lib in Core Gui Qml Quick QuickControls2 Widgets Sql Network QuickDialogs2 QuickLayouts QuickShapes Svg OpenGL; do
              for f in "$QTDIR"/lib/libQt6"$lib".so.*; do
                [ -e "$f" ] && cp -P "$f" "$stage/lib/"
              done
            done
            for plugin in platforms sqldrivers imageformats iconengines tls; do
              [ -d "$QTDIR/plugins/$plugin" ] && cp -R "$QTDIR/plugins/$plugin" "$stage/plugins/"
            done
            [ -d "$QTDIR/qml" ] && cp -R "$QTDIR/qml" "$stage/"
            printf '%s\n' '[Paths]' 'Prefix=.' 'Libraries=lib' 'Plugins=plugins' 'QmlImports=qml' > "$stage/qt.conf"
            printf '%s\n' '#!/bin/sh' 'HERE=$(dirname "$0")' 'LD_LIBRARY_PATH="$HERE/lib:$LD_LIBRARY_PATH" exec "$HERE/daymark" "$@"' > "$stage/daymark.sh"
            chmod +x "$stage/daymark.sh" "$stage/daymark"
            # Collect the runtime closure of the executable and deployed QML/plugins.
            # A fixed module list misses dependencies such as QuickTemplates2/XcbQpa.
            while IFS= read -r -d '' binary; do
              LD_LIBRARY_PATH="$QTDIR/lib" ldd "$binary" > build/qt-runtime-dependencies.txt
              if grep -q 'libQt6.*=> not found' build/qt-runtime-dependencies.txt; then
                echo "::error::A deployed plugin has unresolved Qt libraries"; exit 1
              fi
              while IFS= read -r library; do
                cp -L "$library" "$stage/lib/$(basename "$library")"
              done < <(awk -v qt="$QTDIR/lib/" '$2 == "=>" && index($3, qt) == 1 { print $3 }' build/qt-runtime-dependencies.txt)
            done < <(find "$stage" -type f \( -name '*.so' -o -name '*.so.*' -o -name daymark \) -print0)
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Exercise the deployed QML/SQLite runtime, not the original build tree.
            env -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH \
              QT_QPA_PLATFORM=offscreen LD_LIBRARY_PATH="$PWD/$stage/lib" \
              "$stage/daymark" --contextual-workspace-smoke
          fi
          cp LICENSE CONTRIBUTING.md "$stage/" 2>/dev/null || true
          cp packaging/THIRD-PARTY-NOTICES.md "$stage/"
          cp LICENSE "$stage/LGPL-3.0.txt"
          cp packaging/licenses/GPL-3.0.txt "$stage/"
          python3 build/release-tools/scripts/copy-qt-sbom.py --qt-root "$QTDIR" --destination "$stage/qt-sbom" --version 6.10.2
          printf '%s\n' 'Daymark - tagged build artifact' ''             'Qt runtime is licensed under LGPLv3 and linked dynamically; see THIRD-PARTY-NOTICES.md.'             'This archive is not code-signed and has not been validated on a clean machine.' > "$stage/README.txt"
          (cd build/stage && tar -czf "../artifacts/$name.tar.gz" "$name")
          (cd build/artifacts && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Record artifact digests
        shell: bash
        run: |
          cd build/artifacts
          ls -l
          cat *.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.label }}
          path: build/artifacts/*
          if-no-files-found: error
      - name: Collect Windows updater candidate (not a signed update)
        if: runner.os == 'Windows' && hashFiles('src/update/CMakeLists.txt') != ''
        shell: pwsh
        env:
          BUILD_SOURCE: ${{ needs.resolve.outputs.commit }}
          BUILD_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'set\(DAYMARK_VERSION "([^"]+)"\)').Matches[0].Groups[1].Value
          $native = @('build/release/bin/Release','build/release/bin') | Where-Object { Test-Path "$_/daymark-update-cli.exe" }
          if (@($native).Count -ne 1) { throw 'Exactly one updater output directory required' }
          New-Item -ItemType Directory -Path build/update-input/native -Force | Out-Null
          Copy-Item "build/artifacts/Daymark-$version-windows-x64" build/update-input/payload -Recurse
          foreach($name in @('daymark-launcher.exe','daymark-update-cli.exe','daymark-updater.exe')) { Copy-Item "$native/$name" build/update-input/native }
          Import-Module ./scripts/PackageValidation.psm1 -Force
          $inventory = (& ctest --test-dir build/release -C Release --show-only=json-v1) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'CTest inventory unavailable' }
          $summary = Read-DaymarkPreviewTests "$PWD/build/ctest-report.xml" @($inventory.tests.name)
          if (!$summary.fullGatePassed) { throw 'Managed candidate requires every full CTest to pass' }
          $infoPath = 'build/update-input/payload/BUILD-INFO.json'
          $info = Get-Content $infoPath -Raw | ConvertFrom-Json -AsHashtable
          $info.fullTestGatePassed = $true
          $info.knownTestFailures = @()
          $origin = [IO.File]::ReadAllText("$PWD/build/official-service.local.txt").Trim().TrimEnd('/')
          $binaryText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("$PWD/build/update-input/payload/daymark.exe"))
          if (!$origin -or !$binaryText.Contains($origin)) { throw 'Official account configuration is missing from the built executable' }
          $info.officialServiceConfigured = $true
          $info | ConvertTo-Json -Depth 7 | Set-Content $infoPath -Encoding utf8
          [ordered]@{format=1;repository=$env:GITHUB_REPOSITORY;source_revision=$env:BUILD_SOURCE;tag=$env:BUILD_TAG;
            tooling_revision=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;event=$env:GITHUB_EVENT_NAME;
            trigger_ref=$env:GITHUB_REF;official_service_configured=$true} | ConvertTo-Json |
            Set-Content -LiteralPath build/update-input/payload/BUILD-PROVENANCE.json -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows' && hashFiles('src/update/CMakeLists.txt') != ''
        with:
          name: windows-update-candidate
          path: build/update-input/
          if-no-files-found: error
      - name: Remove transient official service configuration
        if: always()
        shell: pwsh
        run: |
          $official = "$PWD/build/official-service.local.txt"
          if (Test-Path -LiteralPath $official) { Remove-Item -LiteralPath $official }
  publish:
    # Managed update assets use the protected Windows publisher. Never attach a
    # flat archive under the managed ZIP's immutable name in that mode.
    if: vars.DAYMARK_MANAGED_WINDOWS_RELEASE != 'true'
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Restore verified Linux/macOS archives
        if: needs.resolve.outputs.reuse_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.reuse_run }}
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Attach archives to the tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Sidecars have unique platform names; create one complete index after
          # merging artifacts instead of overwriting three SHA256SUMS.txt files.
          (cd dist && for checksum in *.sha256; do tr -d '\r' < "$checksum" | sha256sum --check; done
           cat *.sha256 | tr -d '\r' > SHA256SUMS.txt)
          ls -l dist
          # The release record is created by release-source.yml; wait briefly in
          # case the two tag workflows start together.
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then break; fi
            echo "release not visible yet (attempt $attempt)"; sleep 10
          done
          gh release view "$RELEASE_TAG" >/dev/null
          # Uploading the same name twice fails; skip names already attached so a
          # re-run is idempotent instead of silently replacing an artifact.
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for file in dist/*; do
            name=$(basename "$file")
            if grep -qxF "$name" <<<"$existing"; then
              echo "already attached: $name"
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
          gh release view "$RELEASE_TAG" --json tagName,assets --jq '{tag:.tagName,assets:[.assets[].name]}'
