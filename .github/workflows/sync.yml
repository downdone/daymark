name: Account and sync
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check generated contracts
        run: python ../scripts/generate-sync-contract.py --check
      - name: Download pinned dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Check dependency notices
        run: python ../scripts/collect-server-licenses.py --check
      - name: Vet
        run: go vet ./...
      - name: Unit, SQLite, process crash and TLS integration tests
        run: go test ./... -count=1 -timeout=5m
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1 -timeout=5m
      - name: Build service
        run: go build -trimpath ./cmd/daymark-server
  desktop-sync:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          cache: true
          aqtversion: '==3.3.0'
      - name: Configure desktop tests
        run: cmake -S . -B build/sync-ci -DBUILD_TESTING=ON
      - name: Build real Qt workspace
        run: cmake --build build/sync-ci --config Release --target test_task_workspace test_data_transfer --parallel 4
      - name: Desktop journal and mapping regression
        run: ctest --test-dir build/sync-ci -C Release -R "^(data_transfer|task_workspace)$" --output-on-failure --no-tests=error
      - name: Two Qt workspaces against real Go TLS server
        shell: pwsh
        run: |
          $executable = @(Get-ChildItem build/sync-ci -Recurse -Filter test_task_workspace.exe)
          if ($executable.Count -ne 1) { throw 'Expected exactly one Qt integration executable' }
          $env:DAYMARK_QT_SYNC_TEST_EXE = $executable[0].FullName
          Set-Location server
          go test ./internal/httpapi -run '^TestQtDesktopEndToEnd$' -v -count=1 -timeout=5m *> ../build/sync-desktop.log
          $status = $LASTEXITCODE
          Get-Content ../build/sync-desktop.log
          exit $status
      - name: Upload synthetic integration report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sync-desktop-report
          path: build/sync-desktop.log
          if-no-files-found: warn
