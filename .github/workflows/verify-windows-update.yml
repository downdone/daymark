name: Verify public Windows update
on:
  workflow_call:
    inputs:
      expect_toolchain_bridge:
        required: false
        default: false
        type: boolean
      old_version:
        required: true
        type: string
      new_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expect_toolchain_bridge:
        description: Check the full-install toolchain bridge and safe rejection
        required: false
        default: false
        type: boolean
      old_version:
        description: Existing public managed version to upgrade
        required: true
        type: string
      new_version:
        description: Published target version to verify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-windows-update-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'downdone/daymark'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
          architecture: x64
      # Exercise the public payloads on a runner without a Qt SDK or signing secrets.
      - name: Verify anonymous GitHub upgrade in an isolated directory
        shell: pwsh
        env:
          OLD_VERSION: ${{ inputs.old_version }}
          NEW_VERSION: ${{ inputs.new_version }}
          EXPECT_TOOLCHAIN_BRIDGE: ${{ inputs.expect_toolchain_bridge }}
        run: |
          $old = $env:OLD_VERSION
          $new = $env:NEW_VERSION -creplace '^v', ''
          $stable = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ($old -cnotmatch $stable -or $new -cnotmatch $stable) { throw 'Stable version identities required' }
          New-Item -ItemType Directory -Path build -Force | Out-Null
          $work = Join-Path $env:RUNNER_TEMP ('daymark-public-update-' + [guid]::NewGuid())
          $mode=@()
          if ($env:EXPECT_TOOLCHAIN_BRIDGE -eq 'true') { $mode=@('--expect-toolchain-bridge') }
          python -u tests/update/github_flow.py --work $work --old-version $old --new-version $new `
            --wait-for-target-seconds 120 --export-artifacts "$PWD/build/public-update-proof" @mode *> build/public-update-live.log
          $result = $LASTEXITCODE
          Get-Content build/public-update-live.log
          if ($result -ne 0) { exit $result }
          $report = Get-Content build/public-update-proof/report.json -Raw | ConvertFrom-Json
          if ($report.oldVersion -cne $old -or $report.newVersion -cne $new) { throw 'Public test version identities mismatch' }
          if ($env:EXPECT_TOOLCHAIN_BRIDGE -eq 'true') {
            if (!$report.passed -or !$report.anonymousGitHub -or !$report.productionEnvironmentIsolated -or
                !$report.compatibilityRejected -or !$report.manualFullInstallRequired -or $report.automaticUpgrade -or
                $report.error -cne 'update.unsupported_capability' -or !$report.committedInstallationPreserved -or $report.fixtureOverrides) { throw 'Public compatibility bridge report incomplete' }
          } elseif (!$report.passed -or !$report.anonymousGitHub -or !$report.productionEnvironmentIsolated -or
              !$report.qtSaveQuitRestart -or !$report.durableCommitAndRunning -or !$report.oldExecutableDeleted -or
              !$report.syntheticSqlitePreserved -or $report.fixtureOverrides) { throw 'Actual public flow report incomplete' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-windows-update-proof
          path: |
            build/public-update-proof/*.json
            build/public-update-live.log
          if-no-files-found: error
