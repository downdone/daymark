name: Build and test
on:
  push:
    branches: ['**'] # Tags reuse the same source; source publication has its own metadata gate.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test publication guards
        run: python3 -m unittest discover -s tests -p test_release_metadata.py -v
      - name: Check current source version and privacy
        run: python3 scripts/publish-source-release.py --check-current
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: win64_msvc2022_64
          - os: macos-15
            arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.10.2'
          arch: ${{ matrix.arch }}
          cache: true
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure --no-tests=error
      - name: QML lint
        run: cmake --build build/ci --config Release --target daymark_qmllint daymark_style_qmllint
