name: Build and test
on:
  push:
    branches: ['**'] # Tags reuse the same source; source publication has its own metadata gate.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test publication guards
        run: python3 -m unittest discover -s tests -p test_release_metadata.py -v
      - name: Check current source version and privacy
        run: python3 scripts/publish-source-release.py --check-current
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: win64_msvc2022_64
          - os: macos-15
            arch: clang_64
          - os: ubuntu-24.04
            arch: linux_gcc_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Qt's Linux desktop build links against X11/OpenGL and needs the
      # platform runtime to load the offscreen platform plugin used by tests.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libgl1-mesa-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libxcb-xkb1 libdbus-1-3 \
            fonts-noto-cjk fonts-dejavu-core
      # Official open-source Qt builds (LGPLv3) from the Qt download server.
      # The aqt version is pinned so the CI install path stays reproducible; the
      # `opensource` user flag (aqt default) selects the community archives rather
      # than any commercially licensed package.
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.10.2'
          arch: ${{ matrix.arch }}
          cache: true
          aqtversion: '==3.3.0'
          # Linux dependencies are installed explicitly above so the package set
          # is visible in this repository rather than delegated to the action.
          install-deps: false
      - name: Record Qt licence basis
        shell: bash
        run: |
          echo "Qt kit: ${{ matrix.arch }} 6.10.2 (open-source/LGPLv3 archives via aqtinstall)"
          echo "Qt install root: ${QT_ROOT_DIR:-$Qt6_DIR}"
          ls "${QT_ROOT_DIR:-$Qt6_DIR}/LICENSES" 2>/dev/null | head -20 || true
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci --config Release --parallel 4
      - name: Test
        shell: bash
        run: |
          set +e
          report="$PWD/build/ctest-report.xml"
          log="$PWD/build/ctest-console.log"
          mkdir -p build
          ctest --test-dir build/ci -C Release --output-on-failure --no-tests=error \
                --output-junit "$report" >"$log" 2>&1
          status=$?
          cat "$log"
          echo "ctest exit: $status"
          # The job log needs admin rights on some accounts; annotations are public.
          python3 scripts/report-ctest-failures.py "$report" "$log" || true
          exit $status
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-report-${{ matrix.arch }}
          path: |
            build/ctest-report.xml
            build/ctest-console.log
          if-no-files-found: warn
      - name: QML lint
        run: cmake --build build/ci --config Release --target daymark_qmllint daymark_style_qmllint
