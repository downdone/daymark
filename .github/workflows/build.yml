name: Build and test
on:
  push:
    branches: ['**'] # Tags reuse the same source; source publication has its own metadata gate.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: ubuntu-latest
    outputs:
      tagged_candidate: ${{ steps.release.outputs.tagged_candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
      - name: Test publication guards
        run: |
          python3 -m unittest discover -s tests -p test_release_metadata.py -v
          python3 -m unittest discover -s tests -p test_update_publication.py -v
          python3 -m unittest discover -s tests -p test_native_imports.py -v
      - name: Check current source version and privacy
        run: python3 scripts/publish-source-release.py --check-current
      - name: Check diagnostic and sync contracts
        run: |
          python3 scripts/generate-diagnostics.py --check
          python3 scripts/generate-sync-contract.py --check
      - name: Check for an identical tagged release candidate
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          version=$(sed -n 's/^set(DAYMARK_VERSION "\([0-9.]*\)")$/\1/p' CMakeLists.txt)
          tag="refs/tags/v$version"
          if [[ -n "$version" ]] && refs=$(git ls-remote --tags origin "$tag" "$tag^{}") &&
             awk -v tag="$tag" -v commit="$GITHUB_SHA" \
               '$2 == tag {object = $1} $2 == tag "^{}" {source = $1}
                END {exit !(object && object != commit && source == commit)}' <<< "$refs"; then
            echo 'tagged_candidate=true' >> "$GITHUB_OUTPUT"
            echo 'The identical annotated tag runs the full Windows candidate gate.'
          fi
  desktop:
    needs: source-policy
    if: needs.source-policy.outputs.tagged_candidate != 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
      # Qt's Linux desktop build links against X11/OpenGL and needs the
      # platform runtime to load the offscreen platform plugin used by tests.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libgl1-mesa-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libxcb-xkb1 libdbus-1-3 \
            fonts-noto-cjk fonts-dejavu-core
      # Official open-source Qt builds (LGPLv3) from the Qt download server.
      # The aqt version is pinned so the CI install path stays reproducible; the
      # `opensource` user flag (aqt default) selects the community archives rather
      # than any commercially licensed package.
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.10.3'
          modules: qtshadertools
          arch: ${{ matrix.arch }}
          cache: true
          aqtversion: '==3.3.0'
          # Linux dependencies are installed explicitly above so the package set
          # is visible in this repository rather than delegated to the action.
          install-deps: false
      - name: Record Qt licence basis
        shell: bash
        run: |
          echo "Qt kit: ${{ matrix.arch }} 6.10.3 (open-source/LGPLv3 archives via aqtinstall)"
          echo "Qt install root: ${QT_ROOT_DIR:-$Qt6_DIR}"
          ls "${QT_ROOT_DIR:-$Qt6_DIR}/LICENSES" 2>/dev/null | head -20 || true
      - name: Configure matching release features with example account origin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          'https://sync.example.invalid' | Set-Content build/diagnostic-official.txt
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON "-DDAYMARK_OFFICIAL_CONFIG=$PWD/build/diagnostic-official.txt" "-DDAYMARK_UPDATE_PUBLIC_KEYS=$PWD/config/update-public-keys.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the fixed 4.0.3 application
        run: cmake --build build/ci --config Release --target daymark --parallel 4
      - name: Compare rendering alone, after neighboring tests and without disk cache
        shell: pwsh
        run: |
          $env:QT_QPA_FONTDIR=Join-Path $env:WINDIR 'Fonts'
          $env:QML_DISK_CACHE_PATH=Join-Path $env:RUNNER_TEMP 'daymark-shared-qml-cache'
          ctest --test-dir build/ci -C Release -R '^desktop_rendering$' -V --no-tests=error
          $alone=$LASTEXITCODE
          ctest --test-dir build/ci -C Release -R '^(qml_startup|calendar_interaction|desktop_surfaces|brand_rendering|desktop_rendering)$' --output-on-failure --no-tests=error
          $neighbors=$LASTEXITCODE
          $cacheFiles=@(Get-ChildItem -LiteralPath $env:QML_DISK_CACHE_PATH -File -Recurse -ErrorAction SilentlyContinue).Count
          $env:QML_DISABLE_DISK_CACHE='1'
          ctest --test-dir build/ci -C Release -R '^desktop_rendering$' -V --no-tests=error
          $withoutCache=$LASTEXITCODE
          [ordered]@{isolated=$alone;preceded=$neighbors;withoutCache=$withoutCache;diskCacheFiles=$cacheFiles} |
            ConvertTo-Json | Tee-Object -FilePath build/rendering-diagnosis.json
          if ($alone -ne 0 -or $neighbors -ne 0 -or $withoutCache -ne 0) { exit 1 }
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-report-${{ matrix.arch }}
          path: |
            build/rendering-diagnosis.json
            build/ci/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: QML lint
        run: cmake --build build/ci --config Release --target daymark_qmllint daymark_style_qmllint
