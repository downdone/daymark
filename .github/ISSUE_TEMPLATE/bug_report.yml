name: Bug report
description: Report a defect in Daymark
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real task databases, backups, logs with personal paths, or credentials.
        Reports about security vulnerabilities belong in the private advisory flow (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Daymark version
      description: Shown in Settings / About, or the release tag you built from.
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows 11 23H2 x64 / macOS 15 arm64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach real task data, credentials or personal logs.
          required: true
